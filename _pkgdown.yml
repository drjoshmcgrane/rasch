url: https://drjoshmcgrane.github.io/rasch/

template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true
  bslib:
    preset: bootstrap
    primary: "#1d3557"
    bg: "#ffffff"
    fg: "#1e293b"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}
    pkgdown-nav-height: 72px

home:
  title: "rasch: Models and Diagnostics for Rasch Measurement Theory"
  description: >
    Models and diagnostics for examining sufficiency and invariance within
    Rasch Measurement Theory, with a point-and-click Shiny application.
  sidebar:
    structure: [links, license, citation, authors, dev]
    components:
      links:
        title: Links
        text: |
          [View on CRAN](https://CRAN.R-project.org/package=rasch)

          [Browse source code](https://github.com/drjoshmcgrane/rasch)

          [Report a bug](https://github.com/drjoshmcgrane/rasch/issues)

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: Changelog
      href: news/index.html

news:
  cran_dates: true

articles:
- title: Vignettes
  contents:
  - data-structures
  - rasch-workflow
  - dif-repeated-measures
  - many-facet
  - extended-frame-reference
  - explanatory-models
  - paired-comparisons
  - plant-and-detect
- title: Case studies
  contents:
  - articles/case-study-verbal-aggression
  - articles/wording-units-selfesteem
  - articles/wording-units-height
  - articles/party-blocs-crisis

reference:
- title: Estimation
  desc: >
    Fit Rasch models and estimate item and person parameters.
  contents:
  - rasch
  - rasch_mfrm
  - rasch_efrm
  - rasch_explanatory
  - btl_explanatory
  - explanatory_test
  - explanatory_diagnostics
  - relax_explanatory
  - relax_btl_explanatory
  - pcml
  - pcml_pc
  - threshold_index
  - item_moments

- title: Test of fit and comparison
  desc: >
    Examine fit, targeting and reliability, or compare fitted models.
  contents:
  - fit_summary_table
  - targeting_table
  - chisq_detail
  - fit_bootstrap
  - test_information
  - lr_test
  - compare_fits
  - guttman_table

- title: Persons
  contents:
  - person_wle
  - weighted_person_estimates
  - person_extrapolated
  - score_table

- title: Invariance and DIF
  desc: >
    Examine DIF across groups or occasions and equate calibrations.
  contents:
  - dif_anova
  - dif_bootstrap
  - dif_contrasts
  - dif_posthoc
  - dif_size
  - split_items
  - drop_items
  - resolve_frames
  - frame_invariance
  - resolve_dif
  - equate_tests
  - tailored_analysis

- title: Independence and dimensionality
  desc: >
    Examine dimensionality and local response dependence.
  contents:
  - residual_correlations
  - residual_pca
  - dimensionality_test
  - dimensionality_magnitude
  - dependence_magnitude
  - spread_test
  - combine_items
  - rack_data
  - stack_data

- title: Multiple choice and traditional statistics
  contents:
  - distractor_analysis
  - distractor_rescore
  - ctt_table

- title: Paired comparisons
  desc: >
    Fit and examine models for dichotomous or ordered paired comparisons.
  contents:
  - btl
  - btl_dif
  - btl_efrm
  - btl_transitivity
  - btl_dimensionality
  - btl_equate
  - btl_information
  - btl_next_pairs
  - judge_surprise
  - judge_pair_surprise
  - plot_btl
  - plot_btl_categories
  - plot_btl_icc
  - plot_btl_dependence
  - plot_btl_transitivity
  - plot_btl_scree
  - plot_btl_dim_map
  - plot_btl_judge_map
  - plot_btl_units
  - plot_btl_equate
  - plot_btl_targeting

- title: Plots
  desc: Plot fitted models and diagnostic results.
  contents:
  - wright_map
  - starts_with("plot_")
  - -starts_with("plot_btl")

- title: Data simulation
  desc: >
    Simulate data from the fitted model families.
  contents:
  - simulate_rasch
  - simulate_btl
  - simulate_mfrm
  - simulate_efrm
  - simulate_btl_efrm
  - sim_replicate
  - sim_apply
  - sim_recovery
  - plot_recovery
  - rasch_rng

- title: Export and interface
  desc: >
    Export results or launch the Shiny application.
  contents:
  - save_outputs
  - save_item_plots
  - save_person_plots
  - report_html
  - report_document
  - run_app
